# MNIST with a Poisson rate code and a spike-count readout: large networks
# (700-5000 motifs) and long simulations. Expect long runs; use the GPU backend
# or Pultsito with several workers.

[data]
name = "mnist"
path = "third_party/pultsito/lib/MNIST_for_C/data"   # idx files shipped with Pultsito
time_steps = 100
max_rate = 0.2
limit = 5000               # Poisson-encode only the first 5000 images of each split

[genome]
n_motifs = [700, 5000]
fan_out = [2, 10]
input_fan_out = [1, 3]
v_thresh = [-55.0, -45.0]
v_rest = [-75.0, -65.0]
weight = [10.0, 20.0]
evolve_weights = false

[simulator]
backend = "pultsito"
time_steps = 300
batch_size = 32
n_threads = 8

[fitness]
objectives = ["separation", "spikes"]
features = "counts"        # "binned" to use spike timing as well
dispersion = "mean"
n_reference = 10
n_query = 10
n_repetitions = 3

[evolution]
pop_size = 16
generations = 10
out_dir = "results/mnist"
